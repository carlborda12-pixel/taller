/* v5b: cambios campo por campo */
SYNC.baseJ={};
const ymOf=x=>{const f=x&&(x.fecha||x.hasta||x.desde);return typeof f==='string'&&/^\d{4}-\d{2}/.test(f)?f.slice(0,7):'0000-00';};
function setBaseRec(c,x){const id=srid(c,x);const j=JSON.stringify(x);(SYNC.base[c]=SYNC.base[c]||{})[id]=fnv(j);(SYNC.baseJ[c]=SYNC.baseJ[c]||{})[id]=j;const f=SNUM[c];if(f)(SYNC.baseN[c]=SYNC.baseN[c]||{})[id]=num(x[f]);}
function rebaseAll(){SYNC.base={};SYNC.baseN={};SYNC.baseObj={};SYNC.baseJ={};[...SPC,...SNC].forEach(c=>(S[c]||[]).forEach(x=>setBaseRec(c,x)));SOB.forEach(o=>SYNC.baseObj[o]=fnv(JSON.stringify(S[o])));}
function sDiff(){const put=[],inc=[],obj={};
  [...SPC,...SNC].forEach(c=>{const B=SYNC.base[c]||{},BN=SYNC.baseN[c]||{},BJ=SYNC.baseJ[c]||{};const nf=SNUM[c];
    (S[c]||[]).forEach(x=>{const id=srid(c,x);if(!id)return;const j=JSON.stringify(x);const h=fnv(j);if(B[id]===h)return;
      const isNew=B[id]===undefined;let p;
      if(isNew||!BJ[id]){p=JSON.parse(j);}
      else{const b=JSON.parse(BJ[id]);p={};Object.keys(x).forEach(f=>{if(f===nf)return;if(JSON.stringify(x[f])!==JSON.stringify(b[f]))p[f]=JSON.parse(JSON.stringify(x[f]));});}
      if(SCLAIM[c]&&isNew)p._claim=1;
      put.push({c,id,p,h,j,m:ymOf(x),empty:!isNew&&!!BJ[id]&&!Object.keys(p).length});
      if(nf){const dn=round2(num(x[nf])-num(BN[id]));if(dn)inc.push({c,id,f:nf,n:dn});}});});
  SOB.forEach(o=>{if(S[o]===undefined)return;const j=JSON.stringify(S[o]);if(SYNC.baseObj[o]!==fnv(j))obj[o]=JSON.parse(j);});
  return {put,inc,obj};}
async function push(){
  if(!SYNC.on||SYNC.busy)return;
  const ch=sDiff();
  if(!ch.put.length&&!Object.keys(ch.obj).length){SYNC.pending=false;if(SYNC.needFull)return fullReload();renderSync('ok');return;}
  SYNC.busy=true;SYNC.pending=false;renderSync('saving');
  const batch=ch.put.slice(0,400);const ids=new Set(batch.map(p=>p.c+'|'+p.id));const inc=ch.inc.filter(i=>ids.has(i.c+'|'+i.id));
  if(ch.put.length>batch.length)SYNC.pending=true;
  try{const r=await api('POST','/api/sync?since='+SYNC.ver,{put:batch.filter(p=>!p.empty).map(p=>({c:p.c,id:p.id,p:p.p,m:p.m})),inc:inc.map(i=>({c:i.c,id:i.id,f:i.f,n:i.n})),obj:ch.obj});
    if(r.ok){const j=await r.json();
      batch.forEach(p=>{(SYNC.base[p.c]=SYNC.base[p.c]||{})[p.id]=p.h;(SYNC.baseJ[p.c]=SYNC.baseJ[p.c]||{})[p.id]=p.j;});inc.forEach(i=>{const BN=SYNC.baseN[i.c]=SYNC.baseN[i.c]||{};BN[i.id]=round2(num(BN[i.id])+i.n);});
      Object.keys(ch.obj).forEach(o=>SYNC.baseObj[o]=fnv(JSON.stringify(ch.obj[o])));
      (j.renum||[]).forEach(x=>{const rec=(S[x.c]||[]).find(y=>srid(x.c,y)===x.id);if(rec){rec[SCLAIM[x.c]]=x.n;setBaseRec(x.c,rec);}if(x.c==='comps')toast(`Otro equipo usó el mismo número: el comprobante quedó como ${pad8(x.n)}.`,'warn');});
      if(j.stale){SYNC.needFull=true;metaSave();}else applyChanges(j);
      renderSync(SYNC.pending?'saving':'ok');}
    else if(r.status===401){SYNC.busy=false;const j=await r.json().catch(()=>({}));pinModal(j.error||'Tu clave ya no es válida. Ingresala de nuevo.');return;}
    else{SYNC.pending=true;renderSync(r.status===429||r.status===503?'saving':'error');}
  }catch(e){SYNC.pending=true;renderSync('offline');}
  SYNC.busy=false;
  if(SYNC.pending){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,SYNC.state==='offline'||SYNC.state==='error'?5000:300+Math.random()*700);}
  else if(SYNC.needFull)fullReload();
}
function applyChanges(j){
  if(typeof emitiendo!=='undefined'&&emitiendo&&!j.full)return;
  if(j.full){buildFromFull(j);return;}
  let touched=false;
  Object.keys(j.cols||{}).forEach(c=>{if(!S[c])S[c]=[];const B=SYNC.base[c]||{},BN=SYNC.baseN[c]||{},BJ=SYNC.baseJ[c]||{};const nf=SNUM[c];const idx=new Map(S[c].map((x,i)=>[srid(c,x),i]));
    j.cols[c].forEach(srv=>{const id=srid(c,srv);const ix=idx.get(id);touched=true;
      if(ix===undefined){S[c].push(srv);setBaseRec(c,srv);return;}
      const loc=S[c][ix];const lj=JSON.stringify(loc);
      if(B[id]===fnv(lj)){S[c][ix]=srv;setBaseRec(c,srv);return;}
      const b=BJ[id]?JSON.parse(BJ[id]):null;const m=Object.assign({},srv);
      Object.keys(loc).forEach(f=>{if(f===nf)return;if(!b||JSON.stringify(loc[f])!==JSON.stringify(b[f]))m[f]=loc[f];});
      if(nf)m[nf]=round2(num(srv[nf])+(num(loc[nf])-num(BN[id])));
      const k=SCLAIM[c];if(k&&B[id]!==undefined)m[k]=srv[k];
      S[c][ix]=m;setBaseRec(c,srv);});});
  Object.keys(j.objs||{}).forEach(o=>{const lj=fnv(JSON.stringify(S[o]));if(SYNC.baseObj[o]===undefined||SYNC.baseObj[o]===lj)S[o]=j.objs[o];SYNC.baseObj[o]=fnv(JSON.stringify(j.objs[o]));touched=true;});
  applyNums(j.nums);
  if(j.ver)SYNC.ver=j.ver;metaSave();
  if(touched){localSave();softRender();}
}

/* v5c: reserva atómica de stock antes de cobrar */
async function apiFast(url,body){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),3000);try{return await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-app-pin':SYNC.pin},body:JSON.stringify(body||{}),signal:ctl.signal});}finally{clearTimeout(tm);}}
async function emitirConNumero(print){
  if(emitiendo)return;emitiendo=true;
  try{const d=ui.draft;const t=tipoDraft();let res=null,items=[];
    if(SYNC.on&&SYNC.state!=='offline'){
      if(!d.origen){const agg={};d.items.filter(i=>i.r).forEach(i=>{agg[i.r]=(agg[i.r]||0)+num(i.q);});items=Object.entries(agg).map(([id,q])=>({id,q}));}
      try{const r=await apiFast('/api/sync?op=reserve',{t,items});
        if(r.status===409){const j=await r.json();const rr=R(j.id);if(rr){rr.stock=j.stock;setBaseRec('repuestos',rr);localSave();render();}
          toast(`${rr?rr.nombre:'Un repuesto'}: ${j.stock>0?`solo quedan ${fQ(j.stock)}`:'no queda stock'}. Otro equipo lo vendió recién.`,'bad');return;}
        if(r.ok)res=await r.json();
      }catch(e){res=null;}
    }
    if(res)S.num[t]=res.n-1;
    let c;
    try{c=cobrarDraft(print);}
    catch(err){if(res&&items.length){apiFast('/api/sync?op=release',{items}).catch(()=>{});}throw err;}
    if(SYNC.on){
      if(res){c.ntok=res.tok;const BN=SYNC.baseN.repuestos=SYNC.baseN.repuestos||{};items.forEach(i=>{BN[i.id]=round2(num(BN[i.id])-i.q);});}
      else c.prov=true;
      save();}
  }catch(err){toast(err.message,'bad');}
  finally{emitiendo=false;setTimeout(()=>{if(!SYNC.busy)poll();},60);}
}

/* ================= v6: app instalable ================= */
let installEvt=null;
const isStandalone=()=>{try{return window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true;}catch(e){return false;}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=()=>/android/i.test(navigator.userAgent);
const swOk=()=>'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1');
function canInstall(){return swOk()&&!isStandalone()&&(!!installEvt||isIOS());}
function renderInstall(){document.querySelectorAll('.installslot').forEach(el=>{el.innerHTML=canInstall()?'<button class="btn sm primary helpbtn" data-act="install" title="Instalar el sistema como app en este equipo"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M4 14.5v2h12v-2"/></svg><span class="bt">Instalar app</span></button>':'';});}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;renderInstall();});
window.addEventListener('appinstalled',()=>{installEvt=null;renderInstall();toast('Listo: la app quedó instalada. Buscala en el escritorio o en el menú de aplicaciones.');});

    <div class="box"><h4>${and?'En este celular Android':'En Android'}</h4><ol class="hsteps"><li><span>Abrí el sistema en <b>Chrome</b>.</span></li><li><span>Tocá el menú <b>⋮</b> arriba a la derecha.</span></li><li><span>Elegí <b>"Instalar app"</b> o <b>"Agregar a la pantalla principal"</b>.</span></li></ol></div>
    <div class="box"><h4>${!ios&&!and?'En esta computadora':'En la computadora'}</h4><ol class="hsteps"><li><span>Abrí el sistema en <b>Chrome</b> o <b>Edge</b>.</span></li><li><span>Tocá el ícono de instalar que aparece a la derecha de la barra de direcciones, o el menú <b>⋮</b> → <b>"Instalar Repuestos Core OS"</b>.</span></li><li><span>Queda en el escritorio y en el menú Inicio.</span></li></ol></div>

if(swOk()){window.addEventListener('load',()=>{let had=!!navigator.serviceWorker.controller;

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  if(!e.target.closest('[data-act="tip"]')&&!e.target.closest('#tipPop'))hideTip();
  if(e.target.classList&&e.target.classList.contains('ov')){closeModal();return;}

function onField(e){
  const el=e.target;
  if(el.closest&&el.closest('#modal')){
    if(el.dataset.m!==undefined&&Mo){const v=el.type==='checkbox'?el.checked:el.value;if(setM(el.dataset.m,v))renderModal();}
    return;
  }
  if(el.dataset.fd!==undefined){const k=el.dataset.fd;const v=el.type==='checkbox'?el.checked:el.value;if(ui.draft[k]===v)return;ui.draft[k]=v;
    if(k==='cliente'){const c=C(v);ui.draft.recNombre='';ui.draft.recDoc='';if(!c.cc&&ui.draft.condVenta==='cc')ui.draft.condVenta='contado';}
    render();return;}
  if(el.dataset.fi){const [i,f]=el.dataset.fi.split(':');const it=ui.draft.items[+i];if(!it||String(it[f])===el.value)return;it[f]=el.value;render();return;}
  if(el.dataset.fp){const [i,f]=el.dataset.fp.split(':');const pg=ui.draft.pagos[+i];if(!pg||String(pg[f])===el.value)return;pg[f]=el.value;render();return;}
  if(el.dataset.track){if(e.type==='change'){const en=S.envios.find(x=>x.id===el.dataset.track);en.tracking=el.value.trim();save();toast('Seguimiento guardado.');}return;}
  if(el.dataset.creal){if(e.type==='change'){const en=S.envios.find(x=>x.id===el.dataset.creal);en.real=el.value===''?'':num(el.value);save();render();}return;}
  if(el.dataset.bind){

    if(k==='rol'){saveUi();closeModal();}
    if(k==='fModelo'&&!v)ui.fAnio='';
    render();
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTip();if(Mo)closeModal();}if(e.key==='Enter'&&e.target.id==='fsrch'){e.preventDefault();const q=ui.draft.q.trim();const ex=q&&S.repuestos.find(x=>x.barras===q||norm(x.cod)===norm(q));if(ex){ui.draft.q='';scanAdd(q);return;}const r=fList().find(x=>x.stock-fInF(x.id)>0);if(r){try{ACT.fAdd({id:r.id});}catch(err){toast(err.message,'bad');}}}if(e.key==='Enter'&&e.target.id==='fcliq'){e.preventDefault();const b=document.querySelector('#factBox .fres button');b&&b.click();}});

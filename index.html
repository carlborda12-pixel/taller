<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repuestos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Repuestos Core OS">
<meta name="description" content="Ventas, stock, arreglos, clientes, envíos y caja del taller de repuestos.">
<title>Repuestos Core OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: identidad VESA en un solo tema oscuro de alto contraste — barra lateral negra, superficies grafito y naranja como único acento; en móvil la barra pasa arriba */
:root{
  --bg:#0C0C0D; --surface:#17171A; --surface-2:#202024; --line:#3A3A40; --line-2:#2A2A2F;
  --fg:#F5F5F3; --muted:#C2C2C7; --faint:#8F8F96;
  --accent:#FF6A13; --accent-ink:#0A0A0B; --accent-soft:rgba(255,106,19,.17); --accent-line:#FF6A13;
  --good:#6FD497; --good-soft:#163222; --warn:#F7B252; --warn-soft:#3A2A10; --bad:#FF8A7D; --bad-soft:#42201C; --info:#93C2EC; --info-soft:#172838;
  --side:#000000; --side-fg:#F5F5F3; --side-muted:#A2A2A8; --side-hover:#18181A; --side-active:rgba(255,106,19,.16);
  --scrim:rgba(0,0,0,.7); --focus:#FF8A3D; --shadow:0 16px 48px rgba(0,0,0,.6);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:0}

/* Shell */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:34px;height:34px;flex:none}
.brand-t{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand-t small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.08em;color:var(--side-muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:6px;background:transparent;color:var(--side-muted);cursor:pointer;text-align:left;font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--side-hover);color:var(--side-fg)}
.nav button[aria-current="page"]{background:var(--side-active);color:var(--side-fg)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .lbl{flex:1}
.nav .bdg{font-family:var(--f-mono);font-size:11px;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--side-hover);color:var(--side-fg);text-align:center}
.nav .bdg.warn{background:var(--accent);color:var(--accent-ink)}
.side-note{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 6px;line-height:1.5}
.main{min-width:0;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;line-height:1.05;margin-top:2px}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rol{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.rol select{width:auto;padding:6px 8px}

/* Building blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.ph h2{font-size:14px;font-weight:600}
.ph .sub{font-size:12.5px;color:var(--muted)}
.pb{padding:14px}
.lbl-s{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.in:focus{border-color:var(--focus)}
textarea.in{resize:vertical;min-height:64px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px}
.check input{width:16px;height:16px;accent-color:var(--accent-line)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap;line-height:1.5}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--fg);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);margin-bottom:4px}

/* Tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .nm{font-weight:500}
tr.hl td{background:var(--warn-soft)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.warn .v{color:var(--warn)}

/* Lists */
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line-2);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:default}
.li:last-child{border-bottom:0}
button.li{cursor:pointer}
button.li:hover{background:var(--surface-2)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;overflow-wrap:anywhere}
.li .m{font-size:12.5px;color:var(--muted)}

/* Mostrador */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.search{display:grid;grid-template-columns:minmax(0,1fr) 210px 92px;gap:8px;padding:14px;border-bottom:1px solid var(--line-2)}
.search .q{position:relative}
.search .q svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--faint);stroke-width:1.8;stroke-linecap:round}
.search .q .in{padding-left:32px}
.motos{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-2);align-items:center}
.res:last-child{border-bottom:0}
.res .n{font-weight:500}
.res .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--muted)}
.res .rside{display:flex;align-items:center;gap:12px}
.price{font-family:var(--f-display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cart{position:sticky;top:16px}
.cart .pb{display:flex;flex-direction:column;gap:12px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ci .n{font-weight:500;font-size:13.5px}
.qty{justify-self:start;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:28px;height:28px;cursor:pointer;font-size:15px}
.qty span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.tot{display:flex;flex-direction:column;gap:5px;padding-top:4px}
.tot div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tot .big{font-family:var(--f-display);font-size:28px;font-weight:600;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;align-items:baseline}
.tot .big span:first-child{font-family:var(--f-body);font-size:14px;font-weight:500}
.note{font-size:12.5px;padding:8px 10px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.xbtn{border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:2px 4px}
.xbtn:hover{color:var(--bad)}

/* Toolbar */
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.tbar .in{width:auto}
.tbar .grow{flex:1 1 220px}
.pills{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pills button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.pills button:last-child{border-right:0}
.pills button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* OT board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.col h3{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:2px 2px 4px}
.col h3 .c{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:400}
.otc{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 11px;cursor:pointer}
.otc:hover{border-color:var(--faint)}
.otc .p{font-weight:500;line-height:1.3}
.otc .m{font-size:12px;color:var(--muted)}
.otc .f{display:flex;justify-content:space-between;align-items:center;margin-top:4px;gap:6px}
.st-Recibida{color:var(--muted)} .st-Diagnóstico{color:var(--info)} .st-Presupuestada{color:var(--warn)}
.st-En{color:var(--accent-line)} .st-Lista{color:var(--good)} .st-Entregada{color:var(--faint)} .st-Rechazada{color:var(--bad)}

/* Stepper */
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0;overflow-x:auto}
.steps li{flex:1 0 auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--faint);min-width:86px;padding-right:6px}
.steps li i{display:block;height:4px;border-radius:2px;background:var(--line)}
.steps li.done{color:var(--muted)} .steps li.done i{background:var(--fg);opacity:.55}
.steps li.cur{color:var(--fg);font-weight:600} .steps li.cur i{background:var(--accent)}
.steps li.cur.bad i{background:var(--bad)}
.info-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px 18px}
.info-g div{display:flex;flex-direction:column;gap:2px}
.box{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h4{margin:0;font-size:13px;font-weight:600}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.hist li{display:flex;gap:10px}
.hist .code{min-width:86px}

/* Modal */
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:60;padding-top:max(32px,calc(env(safe-area-inset-top,0px) + 16px));padding-bottom:max(32px,calc(env(safe-area-inset-bottom,0px) + 16px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(620px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal.wide{width:min(860px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.mh h2{font-family:var(--f-display);font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.mb{padding:16px;display:flex;flex-direction:column;gap:16px}
.mf{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line-2);background:var(--surface-2);border-radius:0 0 10px 10px}
.mf:empty{display:none}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}

/* Ticket */
.ticket{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ticket .hd{text-align:center;display:flex;flex-direction:column;gap:2px}
.ticket .hd b{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.ticket .ln{display:flex;justify-content:space-between;gap:12px}
.ticket hr{border:0;border-top:1px dashed var(--line);margin:2px 0;width:100%}

/* Toast */
.toasts{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 16px));display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:7px;box-shadow:var(--shadow);font-size:13.5px;border-left:4px solid var(--good)}
.toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{transform:translateY(8px);opacity:0}}}


/* Estilo VESA: menú, botones y apartados */
.brand-t{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:.01em;text-transform:none;line-height:.9}
.brand-t .pt{color:var(--accent)}
.brand-t small{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.32em;color:var(--side-muted);margin-top:4px;text-transform:uppercase}
.nav{gap:4px}
.nav button{border-radius:8px;padding:10px 12px;text-transform:uppercase;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.06em}
.nav button[aria-current="page"]{background:var(--side-active);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.nav button[aria-current="page"] .bdg{background:var(--accent);color:var(--accent-ink)}
.nav .bdg{font-family:var(--f-mono);letter-spacing:0}
.top h1::after{content:".";color:var(--accent)}
.eyebrow{color:var(--accent)}
.btn{border-radius:8px;text-transform:uppercase;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.05em;padding:8px 14px}
.btn.sm{font-size:13.5px;padding:5px 10px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost:hover{color:var(--accent)}
.btn.outline{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.outline:hover{background:var(--accent-soft)}
.btn.code{text-transform:none;font-family:var(--f-mono);font-size:12px;letter-spacing:0}
.ph h2,.box h4,.col h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ph h2{font-size:17px;display:flex;align-items:center;gap:8px}
.ph h2::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.box h4{font-size:15px}
.panel,.kpi,.box{border-radius:10px}
.kpi .lbl-s{color:var(--muted)}
.pills button{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:14px;font-weight:600}
.pills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check input{accent-color:var(--accent)}
.steps li.done i{background:var(--accent);opacity:.45}
.mh h2::after{content:".";color:var(--accent)}
.ticket .hd b .pt{color:var(--accent)}
.toast{border-left-color:var(--accent)}
.toast.bad{border-left-color:var(--bad)}

/* Facturación */
:root{--paper:#FFFFFF;--ink:#111111;--ink-line:#D9D9D9}
.ftop{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.pills.big button{font-size:15.5px;padding:8px 14px}
.fact{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.fstack{display:flex;flex-direction:column;gap:16px}
.frow{display:flex;gap:14px;align-items:flex-start}

function filtrarCat(q,fm,fa){
  const toks=norm(q).split(/\s+/).filter(Boolean);const anio=parseInt(fa,10);
  return S.repuestos.filter(r=>{
    if(fm){if(r.compat.length&&!r.compat.some(c=>c.m===fm&&(!anio||(anio>=c.d&&anio<=c.h))))return false;}
    if(!toks.length)return true;
    const hay=norm([r.cod,r.oem,r.barras,r.nombre,r.cat,r.marca,CONDS[r.cond],...r.compat.map(c=>modLbl(M(c.m)))].join(' '));
    return toks.every(t=>hay.includes(t));
  });
}

/* ---------- Vista: Órdenes de trabajo ---------- */
function vOT(){

  const list=S.ots.filter(o=>!q||norm([o.pieza,o.falla,C(o.cliente).nombre,'ot-'+pad4(o.num)].join(' ')).includes(q));
  const cols=OT_COLS.map(est=>{
    const os=list.filter(o=>o.estado===est).sort((a,b)=>b.num-a.num);
    const show=est==='Entregada'?os.slice(0,4):os;
    return `<div class="col"><h3><span class="dot st-${est.split(' ')[0]}" style="background:currentColor"></span>${est}<span class="c">${os.length}</span></h3>${show.map(o=>{const c=C(o.cliente);const t=otTotal(o);const vieja=o.estado==='Lista'&&daysSince(o.hist[o.hist.length-1].f)>30;return `<button class="otc" data-act="otOpen" data-id="${o.id}"><span class="code">OT-${pad4(o.num)}</span><span class="p">${esc(o.pieza)}</span><span class="m">${esc(c.nombre)} · ${hace(o.hist[o.hist.length-1].f)}</span><span class="f">${t?`<span class="num small">${money(t)}</span>`:`<span class="small muted">Sin presupuesto</span>`}${o.sena?`<span class="chip good">Seña ${money(o.sena)}</span>`:''}${vieja?'<span class="chip warn">+30 días</span>':''}</span></button>`;}).join('')||`<p class="small muted" style="padding:4px 2px">Sin órdenes.</p>`}${est==='Entregada'&&os.length>4?`<p class="small muted">y ${os.length-4} más</p>`:''}</div>`;

/* ---------- Modal ---------- */
let Mo=null;
function openModal(o){Mo=o;renderModal();const f=document.querySelector('#modal [autofocus]')||document.querySelector('#modal .x');f&&f.focus({preventScroll:true});}
function closeModal(){Mo=null;$('#modal').innerHTML='';}
function renderModal(){
  if(!Mo){$('#modal').innerHTML='';return;}
  keepFocus(()=>{$('#modal').innerHTML=`<div class="ov"><div class="modal ${Mo.wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="mtitle"><header class="mh"><h2 id="mtitle">${esc(typeof Mo.title==='function'?Mo.title(Mo.st):Mo.title)}</h2><button class="x" data-act="mclose" aria-label="Cerrar">×</button></header><div class="mb">${Mo.body(Mo.st)}</div><footer class="mf">${Mo.foot?Mo.foot(Mo.st):''}</footer></div></div>`;});
}
function setM(path,v){
  const st=Mo.st, p=path.split(':');
  if(p[0]==='cmp'){st.compat[p[1]][p[2]]=v;}
  else if(p[0]==='moto'){st.motos[+p[1]][p[2]]=v;}
  else if(p[0]==='sel'){st.sel[p[1]][p[2]]=v;}
  else if(p[0]==='map'){st.map[p[1]]=v;}
  else{if(st[p[0]]===v)return false;st[p[0]]=v;}
  return true;
}

/* ---------- Toast y copiar ---------- */
function copyText(t){
  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();if(ok)toast('Texto copiado.');else openModal({title:'Copiá el texto',st:{},body:()=>`<textarea id="cpy" class="in" rows="5" autofocus>${esc(t)}</textarea><p class="small muted">Seleccioná el texto y copialo con Ctrl+C o mantené presionado en el celular.</p>`});};
  try{navigator.clipboard.writeText(t).then(()=>toast('Texto copiado.'),fb);}catch(e){fb();}
}

function afectados(s){if(s.campo!=='todos'){const vals=[...new Set(S.repuestos.map(r=>r[s.campo]))];if(!vals.includes(s.valor))s.valor=vals.sort()[0];}return S.repuestos.filter(r=>!r.pm&&(s.campo==='todos'||r[s.campo]===s.valor));}

function otModal(id){
  const o=S.ots.find(x=>x.id===id);
  openModal({title:()=>`OT-${pad4(o.num)} · ${o.estado}`,wide:true,
    st:{id,diag:o.diag,mo:String(o.mo||''),items:o.items.map(i=>({...i})),addR:'',addQ:'1',sena:'',senaMedio:'efectivo',pagoMedio:'efectivo',diagCobro:String(o.costoDiag),dirty:false},
    body:otBody,foot:otFoot});
}
function otBody(st){
  const o=S.ots.find(x=>x.id===st.id);const c=C(o.cliente);
  const edit=['Diagnóstico','Presupuestada'].includes(o.estado);
  const path=o.estado==='Rechazada'||(o.estado==='Entregada'&&o.hist.some(h=>h.e==='Rechazada'))?['Recibida','Diagnóstico','Presupuestada','Rechazada','Entregada']:['Recibida','Diagnóstico','Presupuestada','En reparación','Lista','Entregada'];
  const ci=path.indexOf(o.estado);
  const items=edit?st.items:o.items;const mo=edit?num(st.mo):num(o.mo);
  const rep=items.reduce((a,i)=>a+i.p*i.q,0);const total=rep+mo;const saldo=total-o.sena;
  const lastF=e=>{const h=o.hist.filter(x=>x.e===e).pop();return h?fdate(h.f):'';};
  const opts=S.repuestos.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(r=>`<option value="${r.id}" ${r.id===st.addR?'selected':''}>${esc(r.nombre)} · ${money(precio(r,c.lista))} (stock ${r.stock})</option>`).join('');
  let h=otNext(o)+`<ol class="steps">${path.map((e,i)=>`<li class="${i<ci?'done':i===ci?'cur':''} ${e==='Rechazada'&&i===ci?'bad':''}"><i></i>${e}<span class="code" style="font-size:10.5px">${lastF(e)}</span></li>`).join('')}</ol>
  <div class="info-g"><div><span class="lbl-s">Cliente</span><span>${esc(c.nombre)}</span><span class="small muted">${esc(c.tel||'Sin teléfono')}</span></div><div><span class="lbl-s">Pieza</span><span>${esc(o.pieza)}</span></div><div><span class="lbl-s">Moto</span><span>${o.moto.m?esc(modLbl(M(o.moto.m)))+' '+(o.moto.a||''):'No informada'}</span></div><div><span class="lbl-s">Ingresó</span><span>${fdt(o.ingreso)}</span></div></div>
  <div class="box"><h4>Falla declarada</h4><p>${esc(o.falla)}</p></div>
  <div class="box"><h4>Diagnóstico del técnico</h4>${edit?`<textarea id="ot-diag" class="in" data-m="diag" placeholder="Qué encontraste y qué hay que hacer">${esc(st.diag)}</textarea>`:`<p>${esc(o.diag)||'<span class="muted">Pendiente</span>'}</p>`}</div>`;
  if(o.estado!=='Recibida'){
    h+=`<div class="box"><div class="row" style="justify-content:space-between"><h4>Presupuesto</h4><span class="small muted">Precios de lista ${S.listas.find(l=>l.id===c.lista).n}</span></div>
    ${items.length?`<div class="tw"><table><thead><tr><th>Repuesto</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Subtotal</th>${edit?'<th></th>':''}</tr></thead><tbody>${items.map((i,ix)=>{const r=R(i.r);return `<tr><td>${esc(i.n)}${r&&!o.stockOut&&r.stock<i.q?' <span class="chip bad">Falta stock</span>':''}</td><td class="r">${i.q}</td><td class="r">${money(i.p)}</td><td class="r">${money(i.p*i.q)}</td>${edit?`<td class="r"><button class="xbtn" data-act="otRmItem" data-ix="${ix}" aria-label="Quitar">×</button></td>`:''}</tr>`;}).join('')}</tbody></table></div>`:`<p class="small muted">Sin repuestos cargados.</p>`}
    ${edit?`<div class="row" style="flex-wrap:wrap"><select id="ot-addr" class="in" style="flex:1 1 260px" data-m="addR" aria-label="Repuesto a agregar"><option value="">Agregar repuesto del stock…</option>${opts}</select><input id="ot-addq" class="in" type="text" inputmode="decimal" min="1" style="width:74px" value="${esc(st.addQ)}" data-m="addQ" aria-label="Cantidad"><button class="btn sm" data-act="otAddItem" ${st.addR?'':'disabled'}>Agregar</button></div>
    <label class="field" style="max-width:220px"><span>Mano de obra</span><input id="ot-mo" class="in" type="text" inputmode="decimal" min="0" step="500" value="${esc(st.mo)}" data-m="mo"></label>`:`<div class="row" style="justify-content:space-between"><span class="muted">Mano de obra</span><span class="num">${money(mo)}</span></div>`}

}
function otFoot(st){

  const msgLista=`Hola ${c.nombre.split(' ')[0]}, tu ${o.pieza} ya está lista para retirar.${saldo>0?' Saldo a abonar: '+money(saldo)+'.':''} Te esperamos.`;
  const b=[];
  if(o.estado==='Recibida')b.push(`<button class="btn primary" data-act="otMove" data-to="Diagnóstico">Pasar a diagnóstico</button>`);
  if(o.estado==='Diagnóstico'){b.push(`<button class="btn" data-act="otGuardar">Guardar</button>`);b.push(`<button class="btn primary" data-act="otPresup">Enviar presupuesto</button>`);}

  if(o.estado==='En reparación')b.push(`<button class="btn primary" data-act="otMove" data-to="Lista">Marcar lista para retirar</button>`);
  if(o.estado==='Lista'){b.push(`<button class="btn ghost" data-act="copy" data-text="${esc(msgLista)}">Copiar aviso WhatsApp</button>`);if(!tec)b.push(`<button class="btn primary" data-act="otEntregar">${saldo>0?`Entregar y cobrar ${money(Math.round(saldo*(1+MED(st.pagoMedio).r)))}`:'Entregar'}</button>`);}
  if(o.estado==='Rechazada'&&!tec)b.push(`<button class="btn primary" data-act="otMove" data-to="Entregada" data-nota="Pieza devuelta sin reparar">Devolver pieza al cliente</button>`);
  if(o.estado==='Entregada')b.push(`<button class="btn primary" data-act="mclose">Cerrar</button>`);
  return b.join('');
}

/* ---------- Facturación ---------- */
const CAN_PRINT=true;
const fmt2=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:2,maximumFractionDigits:2});
const m2=n=>fmt2.format(n||0);
const COND_IVA={CF:'Consumidor Final',MT:'Responsable Monotributo',RI:'IVA Responsable Inscripto',EX:'IVA Sujeto Exento'};
const T_LBL={FA:'Factura A',FB:'Factura B',FC:'Factura C',X:'Ticket',NCA:'Nota de crédito A',NCB:'Nota de crédito B',NCC:'Nota de crédito C',NCX:'Anulación de ticket'};
const T_COD={FA:'001',FB:'006',FC:'011',NCA:'003',NCB:'008',NCC:'013'};
const letraDe=t=>t.slice(-1);
const isNC=t=>t.indexOf('NC')===0;
const pad5=n=>String(n).padStart(5,'0'), pad8=n=>String(n).padStart(8,'0');
const compNro=c=>`${pad5(c.pv)}-${pad8(c.nro)}`;
const fdtFull=iso=>new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const fdFull=iso=>new Date(iso).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
const fQ=q=>Number(q).toLocaleString('es-AR');
const pagoLbl=m=>m==='ot'?'Cobrado en Arreglos':MED(m).n;
const pl=(a,b,cls)=>`<div class="pl ${cls||''}"><span>${a}</span><span>${b}</span></div>`;
const sg=c=>isNC(c.tipo)?-1:1;
let LIBRO_CSV='';

function round2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100;}
function ym(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');}
function cuitDigits(c){return String(c||'').replace(/\D/g,'');}
function cuitOk(c){const d=cuitDigits(c);if(d.length!==11)return false;const w=[5,4,3,2,7,6,5,4,3,2];let t=0;for(let i=0;i<10;i++)t+=Number(d[i])*w[i];let v=11-t%11;if(v===11)v=0;if(v===10)return false;return v===Number(d[10]);}
function fmtCuit(c){const d=cuitDigits(c);return d.length===11?`${d.slice(0,2)}-${d.slice(2,10)}-${d.slice(10)}`:c;}
function mkCuit(p,n){const w=[5,4,3,2,7,6,5,4,3,2];for(let k=0;k<60;k++){const b=p+String(Number(n)+k).padStart(8,'0');let t=0;for(let i=0;i<10;i++)t+=Number(b[i])*w[i];let v=11-t%11;if(v===11)v=0;if(v<10)return `${p}-${b.slice(2)}-${v}`;}return `${p}-${n}-0`;}
function fmtDoc(r){if(r.docTipo==='CUIT')return 'CUIT '+r.doc;if(r.docTipo==='DNI')return 'DNI '+Number(cuitDigits(r.doc)).toLocaleString('es-AR');return 'Sin identificar';}
function recDe(c,over){const o=over||{};const dn=cuitDigits(o.doc);return {nombre:String(o.nombre||'').trim()||c.nombre,docTipo:dn?'DNI':(c.docTipo||'CF'),doc:dn||c.doc||'',cond:c.condIVA||'CF',dom:c.dom||''};}
function calcComp(items){
  let n21=0,i21=0,n105=0,i105=0,total=0;
  const lines=items.map(it=>{const q=num(it.q),pu=num(it.pu),dto=num(it.dto),iva=num(it.iva)||21;const imp=round2(q*pu*(1-dto/100));const neto=round2(imp/(1+iva/100));total+=imp;if(iva===10.5){n105+=neto;i105+=imp-neto;}else{n21+=neto;i21+=imp-neto;}return {r:it.r||null,d:it.d,cod:it.cod||'',q,pu,dto,iva,imp,neto};});
  return {lines,n21:round2(n21),i21:round2(i21),n105:round2(n105),i105:round2(i105),total:round2(total)};
}
function caeSim(f){const t=Math.floor(new Date(f).getTime()/1000);return '7'+String(4e12+t%9e12).padStart(13,'0').slice(0,13);}
function mkComp(st,tipo,fecha,cli,items,pagos,extra){
  const x=extra||{};const k=calcComp(items);st.num[tipo]=(st.num[tipo]||0)+1;
  const letra=letraDe(tipo),fiscal=letra!=='X',disc=letra==='A'||letra==='B';
  const c={id:'f'+(st.comps.length+1)+'-'+st.num[tipo]+(typeof DEV==='string'?DEV:''),tipo,letra,pv:st.fiscal.pv,nro:st.num[tipo],fecha,cliente:cli.id,rec:recDe(cli,x.over),lines:k.lines,
    n21:disc?k.n21:0,i21:disc?k.i21:0,n105:disc?k.n105:0,i105:disc?k.i105:0,total:k.total,
    pagos:typeof pagos==='string'?[{medio:pagos,monto:k.total}]:pagos,condVenta:x.condVenta||'contado',obs:x.obs||'',
    cae:fiscal?caeSim(fecha):'',caeVto:fiscal?new Date(new Date(fecha).getTime()+10*864e5).toISOString():'',origen:x.origen||null,asoc:x.asoc||null,anuladoPor:null};
  st.comps.push(c);return c;
}
function ventaLines(v,st){st=st||S;const rr=id=>st.repuestos.find(r=>r.id===id);const ls=v.items.map(i=>({r:i.r,d:i.n,cod:(rr(i.r)||{}).cod||'',q:i.q,pu:i.p,dto:0,iva:21}));
  if(v.envio)ls.push({r:null,d:'Envío',cod:'',q:1,pu:v.envio,dto:0,iva:21});
  if(v.recargo)ls.push({r:null,d:'Recargo financiero '+MED(v.medio).n,cod:'',q:1,pu:v.recargo,dto:0,iva:21});return ls;}
function ventaAsComp(v){const c=C(v.cliente);const k=calcComp(ventaLines(v));return {tipo:'X',letra:'X',pv:1,nro:v.num,fecha:v.fecha,rec:recDe(c),lines:k.lines,n21:0,i21:0,n105:0,i105:0,total:k.total,pagos:[{medio:v.medio,monto:v.total}],condVenta:v.medio==='cc'?'cc':'contado',obs:'',cae:'',asoc:null};}
function vNum(v){if(v.viaFact){const c=S.comps.find(x=>x.id===v.factId);if(c)return `${T_LBL[c.tipo].replace('Factura','Fact.')} ${compNro(c)}`;}return tk(v.num);}
function newDraft(){return {cliente:'c1',interno:false,factura:false,envio:false,envMod:'moto',envDest:'',cliQ:'',presuId:null,showId:false,split:false,pagaCon:'',cat:'',edit:-1,showObs:false,items:[],pagos:[{medio:'efectivo',monto:''}],condVenta:'contado',obs:'',q:'',recNombre:'',recDoc:'',origen:null};}
function tipoPara(cli,interno){if(interno)return 'X';if(S.fiscal.cond==='MT')return 'FC';return cli.condIVA==='RI'?'FA':'FB';}
function tipoDraft(){return tipoPara(C(ui.draft.cliente)||S.clientes[0],!ui.draft.factura);}
function pendientes(){
  const vs=S.ventas.filter(v=>!v.factId).map(v=>({t:'venta',id:v.id,fecha:v.fecha,cliente:v.cliente,total:v.total,cobro:MED(v.medio).n,ref:tk(v.num)}));
  const os=S.ots.filter(o=>o.estado==='Entregada'&&!o.factId&&o.cobrado>0).map(o=>({t:'ot',id:o.id,fecha:o.hist[o.hist.length-1].f,cliente:o.cliente,total:o.cobrado,cobro:'Cobrado en Arreglos',ref:'OT-'+pad4(o.num)}));
  return vs.concat(os).sort((a,b)=>b.fecha.localeCompare(a.fecha));
}
function draftFrom(p){
  const d=newDraft();
  if(p.t==='venta'){const v=S.ventas.find(x=>x.id===p.id);d.cliente=v.cliente;d.items=ventaLines(v);d.pagos=[{medio:v.medio,monto:String(v.total)}];d.condVenta=v.medio==='cc'?'cc':'contado';d.origen={t:'venta',id:v.id,ref:tk(v.num)};}
  else{const o=S.ots.find(x=>x.id===p.id);d.cliente=o.cliente;const rech=o.hist.some(h=>h.e==='Rechazada');
    d.items=rech?[{r:null,d:`Diagnóstico ${o.pieza} (OT-${pad4(o.num)})`,cod:'',q:1,pu:o.cobrado,dto:0,iva:21}]
      :o.items.map(i=>({r:i.r,d:i.n,cod:(R(i.r)||{}).cod||'',q:i.q,pu:i.p,dto:0,iva:21})).concat(num(o.mo)?[{r:null,d:`Mano de obra: ${o.pieza} (OT-${pad4(o.num)})`,cod:'',q:1,pu:num(o.mo),dto:0,iva:21}]:[]);
    d.pagos=[{medio:'ot',monto:String(o.cobrado)}];d.origen={t:'ot',id:o.id,ref:'OT-'+pad4(o.num)};}
  return d;
}

  if(c.letra==='A'){if(c.n21)h+=pl('Neto gravado 21%',m2(c.n21))+pl('IVA 21%',m2(c.i21));if(c.n105)h+=pl('Neto gravado 10,5%',m2(c.n105))+pl('IVA 10,5%',m2(c.i105));}

}

    <td>${an?`<span class="chip bad">Anulada · NC ${pad8(an.nro)}</span>`:isNC(c.tipo)?`<span class="chip info">Anula ${pad8(c.asoc.nro)}</span>`:'<span class="chip good">Vigente</span>'}</td>

function fLibro(){
  const fisc=S.comps.filter(c=>c.letra!=='X');
  const months=[...new Set(fisc.map(c=>ym(c.fecha)))].sort().reverse();
  if(!months.includes(ui.libroMes))ui.libroMes=months[0]||ym(now());
  const mLbl=m=>{const [y,mm]=m.split('-');const t=new Date(Number(y),Number(mm)-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1);};
  const cs=fisc.filter(c=>ym(c.fecha)===ui.libroMes).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const order=['FA','NCA','FB','NCB','FC','NCC'];
  const sum=arr=>arr.reduce((a,c)=>{const g=sg(c);a.n21+=g*c.n21;a.i21+=g*c.i21;a.n105+=g*c.n105;a.i105+=g*c.i105;a.tot+=g*c.total;return a;},{n21:0,i21:0,n105:0,i105:0,tot:0});
  const T=sum(cs);
  const res=order.filter(t=>cs.some(c=>c.tipo===t)).map(t=>{const g=cs.filter(c=>c.tipo===t);const s=sum(g);return `<tr><td><span class="row" style="flex-wrap:nowrap"><span class="lchip">${letraDe(t)}</span>${T_LBL[t]}</span></td><td class="r">${g.length}</td><td class="r">${m2(s.n21)}</td><td class="r">${m2(s.i21)}</td><td class="r">${m2(s.n105)}</td><td class="r">${m2(s.i105)}</td><td class="r">${m2(s.tot)}</td></tr>`;}).join('');
  const f=n=>round2(n).toFixed(2).replace('.',',');
  LIBRO_CSV=['Fecha;Tipo;Punto de venta;Número;Receptor;Documento;Condición IVA;Neto 21%;IVA 21%;Neto 10,5%;IVA 10,5%;Total'].concat(cs.map(c=>{const g=sg(c);return [fdFull(c.fecha),T_LBL[c.tipo],pad5(c.pv),pad8(c.nro),c.rec.nombre,fmtDoc(c.rec),COND_IVA[c.rec.cond],f(g*c.n21),f(g*c.i21),f(g*c.n105),f(g*c.i105),f(g*c.total)].join(';');})).join('\n');
  return `<div class="panel"><div class="tbar"><select id="libroMes" class="in" data-bind="libroMes" aria-label="Período">${months.map(m=>`<option value="${m}" ${m===ui.libroMes?'selected':''}>${mLbl(m)}</option>`).join('')||`<option>${mLbl(ui.libroMes)}</option>`}</select><span class="small muted">Base para la declaración de IVA. Revisala con tu contador antes de presentar.</span><span class="spacer"></span>${olderBtn()}<button class="btn" data-act="libroCsv" ${cs.length?'':'disabled'}>Copiar CSV</button></div>
  <div class="kpis" style="padding:14px">${tile('Débito fiscal',money(T.i21+T.i105),'IVA 21% + 10,5%')}${tile('Neto gravado',money(T.n21+T.n105),'Facturas A y B')}${tile('Total facturado',money(T.tot),`${cs.length} comprobantes`)}</div>
  <div class="tw"><table><thead><tr><th>Tipo</th><th class="r">Cant.</th><th class="r">Neto 21%</th><th class="r">IVA 21%</th><th class="r">Neto 10,5%</th><th class="r">IVA 10,5%</th><th class="r">Total</th></tr></thead><tbody>${res||'<tr><td colspan="7"><div class="empty">Sin comprobantes en el período.</div></td></tr>'}</tbody>${cs.length?`<tfoot><tr><td>Total del período</td><td class="r">${cs.length}</td><td class="r">${m2(T.n21)}</td><td class="r">${m2(T.i21)}</td><td class="r">${m2(T.n105)}</td><td class="r">${m2(T.i105)}</td><td class="r">${m2(T.tot)}</td></tr></tfoot>`:''}</table></div></div>
  <div class="panel"><div class="ph"><h2>Detalle de comprobantes</h2><span class="sub">${mLbl(ui.libroMes)}</span></div><div class="tw"><table><thead><tr><th>Fecha</th><th>Comprobante</th><th>Receptor</th><th>Documento</th><th class="r">Neto</th><th class="r">IVA</th><th class="r">Total</th></tr></thead><tbody>${cs.map(c=>{const n=isNC(c.tipo)?'−':'';const disc=c.letra!=='C';return `<tr><td class="tnum">${fdFull(c.fecha)}</td><td><button class="btn sm ghost code" style="padding:2px 0" data-act="compVer" data-id="${c.id}">${T_LBL[c.tipo].replace('Nota de crédito','NC').replace('Factura','Fact.')} ${compNro(c)}</button></td><td>${esc(c.rec.nombre)}</td><td class="small">${fmtDoc(c.rec)}</td><td class="r">${disc?n+m2(c.n21+c.n105):'—'}</td><td class="r">${disc?n+m2(c.i21+c.i105):'—'}</td><td class="r">${n}${m2(c.total)}</td></tr>`;}).join('')||'<tr><td colspan="7"><div class="empty">Sin comprobantes.</div></td></tr>'}</tbody></table></div></div>`;
}
function emitirDraft(){
  const d=ui.draft;const cli=C(d.cliente);const tipo=tipoDraft();
  if(!d.items.length)fail('Agregá al menos un ítem.');
  d.items.forEach(it=>{if(!String(it.d).trim())fail('Hay un ítem sin descripción.');if(num(it.q)<=0)fail(`La cantidad de ${it.d} tiene que ser mayor a cero.`);if(num(it.pu)<=0)fail(`Falta el precio de ${it.d}.`);if(num(it.dto)<0||num(it.dto)>100)fail('El descuento va de 0 a 100%.');});
  if(tipo==='FA'&&!(cli.docTipo==='CUIT'&&cuitOk(cli.doc)))fail('Para Factura A el cliente necesita un CUIT válido. Editá sus datos fiscales.');
  if(d.recDoc.trim()&&!/^\d{7,8}$/.test(cuitDigits(d.recDoc)))fail('El DNI tiene que tener 7 u 8 dígitos.');
  const k=calcComp(d.items);let pagos,vuelto=0;
  if(d.origen){pagos=d.pagos.map(p=>({medio:p.medio,monto:num(p.monto)}));}
  else{
    const need={};d.items.filter(i=>i.r).forEach(i=>{need[i.r]=(need[i.r]||0)+num(i.q);});
    Object.keys(need).forEach(rid=>{const r=R(rid);if(need[rid]>r.stock)fail(`No alcanza el stock de ${r.nombre} (hay ${r.stock}).`);});
    if(d.condVenta==='cc'){if(!cli.cc)fail('Este cliente no tiene cuenta corriente habilitada.');if(cli.deuda+k.total>cli.limite)fail(`Supera el límite de cuenta corriente de ${cli.nombre} (${money(cli.limite)}).`);pagos=[{medio:'cc',monto:k.total}];}
    else{
      if(!d.split)d.pagos=[{medio:d.pagos[0].medio,monto:d.pagos[0].medio==='efectivo'?d.pagaCon:''}];
      const ps=d.pagos.filter(p=>p.monto!==''||d.pagos.length===1).map(p=>({medio:p.medio,monto:p.monto===''?k.total:round2(num(p.monto))}));
      const tot=round2(ps.reduce((a,p)=>a+p.monto,0));
      if(tot<k.total-0.004)fail(`Faltan ${m2(k.total-tot)} para cubrir el total.`);
      const over=round2(tot-k.total);
      if(over>0){const ef=ps.find(p=>p.medio==='efectivo');if(!ef||ef.monto<over)fail('El pago supera el total. Solo se puede dar vuelto en efectivo.');ef.monto=round2(ef.monto-over);vuelto=over;}
      if(!S.caja.abierta)fail('La caja está cerrada. Abrila en Caja para poder cobrar.');
      pagos=ps.filter(p=>p.monto>0);
    }
  }
  const c=mkComp(S,tipo,now(),cli,d.items,pagos,{over:{nombre:d.recNombre,doc:d.recDoc},condVenta:d.condVenta,obs:d.obs.trim(),origen:d.origen});
  if(d.origen){if(d.origen.t==='venta')S.ventas.find(v=>v.id===d.origen.id).factId=c.id;else if(d.origen.t==='ot')S.ots.find(o=>o.id===d.origen.id).factId=c.id;else if(d.origen.t==='comp'){const tk0=S.comps.find(x=>x.id===d.origen.id);if(tk0)tk0.facturadaEn=c.id;}}
  else{
    const lbl=`${T_LBL[tipo]} ${compNro(c)} · ${c.rec.nombre}`;
    if(d.condVenta==='cc')cli.deuda+=k.total;else pagos.forEach(p=>S.movs.push({id:nid('mv'),sid:S.caja.sid,fecha:c.fecha,tipo:'ingreso',concepto:lbl,medio:p.medio,monto:p.monto,ref:c.id}));
    d.items.filter(i=>i.r).forEach(i=>{R(i.r).stock-=num(i.q);});
    S.seq.v++;S.seq.tk++;
    S.ventas.push({id:'v'+S.seq.v+(typeof DEV==='string'?DEV:''),num:S.seq.tk,fecha:c.fecha,cliente:cli.id,items:d.items.filter(i=>i.r).map(i=>({r:i.r,n:i.d,q:num(i.q),p:num(i.pu)})),sub:k.total,envio:0,recargo:0,total:k.total,medio:(pagos[0]||{}).medio||'efectivo',envioId:null,factId:c.id,viaFact:true});
  }
  save();const ids=d.items.filter(i=>i.r).map(i=>i.r);ui.draft=newDraft();render();compModal(c.id,vuelto);
  toast(`Listo: ${T_LBL[tipo]} ${compNro(c)}.`);if(!d.origen)avisoStock(ids);
  return c;
}

  fPagoRm:d=>{ui.draft.pagos.splice(Number(d.ix),1);render();},
  fCond:d=>{ui.draft.condVenta=d.v;render();},
  fRecargo:()=>{const dr=ui.draft;const m=dr.pagos.map(p=>({p,md:MED(p.medio)})).filter(x=>x.md.r>0).sort((a,b)=>b.md.r-a.md.r)[0];if(!m)return;const base=m.p.monto===''?calcComp(dr.items).total:num(m.p.monto);dr.items.push({r:null,d:`Recargo financiero ${m.md.n}`,cod:'',q:1,pu:round2(base*m.md.r),dto:0,iva:21});if(m.p.monto!=='')m.p.monto=String(round2(num(m.p.monto)*(1+m.md.r)));render();},
  fDiscard:()=>{ui.draft=newDraft();render();},
  fEmit:()=>{emitirDraft();},
  fEmitPrint:()=>{const c=emitirDraft();printComp(c,'80');},
  fFact:d=>{ui.draft=draftFrom({t:d.t,id:d.id});ui.fTab='nuevo';render();window.scrollTo({top:0});},
  fRango:d=>{ui.fRango=d.v;render();},
  compVer:d=>compModal(d.id),
  compPrint:d=>printComp(S.comps.find(x=>x.id===d.id),Mo?Mo.st.fmt:'80'),
  ventaPrint:d=>printComp(ventaAsComp(S.ventas.find(x=>x.id===d.id)),Mo?Mo.st.fmt:'80'),
  ventaFact:d=>{ui.draft=draftFrom({t:'venta',id:d.id});ui.fTab='nuevo';ui.view='facturacion';saveUi();closeModal();render();window.scrollTo({top:0});},
  ncNew:d=>ncModal(d.id),
  ncSave:()=>{
    const s=Mo.st;const c=S.comps.find(x=>x.id===s.id);if(c.anuladoPor)fail('Este comprobante ya tiene una nota de crédito.');
    const cli=C(c.cliente);const tipo=c.letra==='X'?'NCX':'NC'+c.letra;
    if(c.condVenta!=='cc'&&!S.caja.abierta)fail('La caja está cerrada. Abrila para registrar la devolución.');
    if(!s.motivo.trim())fail('Indicá el motivo de la nota de crédito.');
    const nc=mkComp(S,tipo,now(),cli,c.lines.map(l=>Object.assign({},l)),[{medio:c.condVenta==='cc'?'cc':s.medio,monto:c.total}],{condVenta:c.condVenta,obs:s.motivo.trim(),asoc:{tipo:c.tipo,pv:c.pv,nro:c.nro,id:c.id}});
    nc.rec=Object.assign({},c.rec);c.anuladoPor=nc.id;
    if(c.condVenta==='cc')cli.deuda=Math.max(0,round2(cli.deuda-c.total));else egreso(`${T_LBL[tipo]} ${compNro(nc)} · ${c.rec.nombre}`,s.medio,c.total,nc.id);
    if(s.reingreso)c.lines.filter(l=>l.r).forEach(l=>{const r=R(l.r);if(r)r.stock+=num(l.q);});
    save();render();compModal(nc.id);toast(`${T_LBL[tipo]} ${compNro(nc)} emitida.`);
  },
  fiscalEdit:()=>fiscalModal(),
  fiscalSave:()=>{const s=Mo.st;if(!s.razon.trim())fail('Completá la razón social.');if(!cuitOk(s.cuit))fail('El CUIT del emisor no es válido.');const pv=Math.floor(num(s.pv));if(pv<1||pv>99999)fail('El punto de venta va de 1 a 99999.');
    S.fiscal={razon:s.razon.trim(),fantasia:s.fantasia.trim()||s.razon.trim(),cuit:fmtCuit(s.cuit),cond:s.cond,pv,dom:s.dom.trim(),iibb:s.iibb.trim(),inicio:s.inicio.trim()};save();closeModal();render();toast('Datos fiscales guardados.');},
  libroCsv:()=>copyText(LIBRO_CSV)
});

function tipBtn(k){const g=GLOSS[k];return g?`<button type="button" class="tip" data-act="tip" data-k="${k}" aria-label="Qué es ${esc(g[0])}">?</button>`:'';}
function showTip(el,k){const g=GLOSS[k];const p=$('#tipPop');if(!g||!p)return;if(!p.hidden&&p.dataset.k===k){p.hidden=true;return;}
  p.innerHTML=`<b>${esc(g[0])}</b><span>${esc(g[1])}</span>`;p.dataset.k=k;p.hidden=false;
  const r=el.getBoundingClientRect();const w=Math.min(300,window.innerWidth-32);p.style.width=w+'px';
  p.style.left=Math.min(Math.max(16,r.left+r.width/2-w/2),window.innerWidth-w-16)+'px';p.style.top=(r.bottom+8)+'px';
  const ph=p.offsetHeight;if(r.bottom+8+ph>window.innerHeight-12)p.style.top=Math.max(12,r.top-ph-8)+'px';}
function hideTip(){const p=$('#tipPop');if(p)p.hidden=true;}

function payTiles(sel,cli,act,allowCC){return `<div class="paygrid" role="radiogroup" aria-label="Medio de pago">${MEDIOS.filter(m=>m.id!=='cc'||(allowCC&&cli&&cli.cc)).map(m=>`<button type="button" class="pay" role="radio" aria-checked="${m.id===sel}" data-act="${act}" data-v="${m.id}"><svg viewBox="0 0 20 20" aria-hidden="true">${PAY_IC[m.id]}</svg><span>${m.id==='mp'?'Mercado Pago':m.id==='cc'?'En la cuenta':m.n}</span>${m.r?`<small>+${Math.round(m.r*100)}% de recargo</small>`:m.id==='cc'?'<small>Paga después</small>':''}</button>`).join('')}</div>`;}
function quickBills(t){const s=new Set([t]);[1000,2000,5000,10000,20000].forEach(b=>{const r=Math.ceil(t/b)*b;if(r>t)s.add(r);});return [...s].sort((a,b)=>a-b).slice(0,5);}
function cashBlock(o){const t=o.total,has=o.val!=='',diff=round2(num(o.val)-t),bills=quickBills(t);

function vMostrador(){
  const cli=C(ui.clienteId)||S.clientes[0];const lst=S.listas.find(l=>l.id===cli.lista);
  if(ui.medio==='cc'&&!cli.cc)ui.medio='efectivo';
  const list=filtrarCat(ui.q,ui.fModelo,ui.fAnio).sort((a,b)=>(b.stock>0)-(a.stock>0)||a.nombre.localeCompare(b.nombre));
  const inCart=id=>(ui.cart.find(c=>c.r===id)||{}).q||0;
  const filt=ui.q||ui.fModelo||ui.fAnio;
  const motos=cli.motos.length?`<div class="motos"><span>Motos de ${esc(cli.nombre)}. Tocá una para ver solo lo que le sirve:</span>${cli.motos.map(m=>{const on=ui.fModelo===m.m&&String(ui.fAnio)===String(m.a);return `<button class="chip ${on?'acc':''}" data-act="usarMoto" data-m="${m.m}" data-a="${m.a}" aria-pressed="${on}">${esc(modLbl(M(m.m)))} ${m.a}</button>`;}).join('')}</div>`:'';

    :`<div class="empty"><strong>${ui.q?`No encontramos "${esc(ui.q)}".`:'No hay repuestos para esa moto.'}</strong>Revisá cómo está escrito, probá con menos palabras o tocá "Ver todos".</div>`;

    :`<div class="empty" style="padding:18px 8px"><strong>Todavía no agregaste nada.</strong>Buscá el repuesto y tocá "Agregar".</div>`;

  const pay=`${payTiles(ui.medio,cli,'setMedio',true)}${ui.medio==='cc'?`<p class="small muted">Debe ${money(cli.deuda)}. Puede sumar hasta ${money(cli.limite-cli.deuda)} ${tipBtn('cc')}</p>`:''}${ui.medio==='efectivo'&&cc.items.length?cashBlock({total:cc.total,val:ui.pagaCon,id:'pagaCon',bind:'data-bind="pagaCon"',act:'setPaga',fmt:money}):''}`;

  return `<div class="pos">
  <div class="panel">
    <div class="ph"><h2 class="stp"><span class="stepn">1</span>Buscá el repuesto</h2><span class="sub">Precios de lista ${lst.n} ${tipBtn('lista')}</span></div>

      ${pay}

        ${cc.rec?`<div><span class="muted">Recargo ${cc.md.n} (${Math.round(cc.md.r*100)}%)</span><span>${money(cc.rec)}</span></div>`:''}
        <div class="big"><span>Total</span><span>${money(cc.total)}</span></div>

function ean13(b){let s=0;for(let i=0;i<12;i++)s+=Number(b[i])*(i%2?3:1);return b+((10-s%10)%10);}
function migrate(st){
  st.repuestos.forEach((r,i)=>{if(r.barras===undefined)r.barras=ean13('7790'+String(4100000+i*137).padStart(8,'0'));});
  if(!st.presus){const H=h=>new Date(Date.now()-h*36e5).toISOString();const L=(rid,q,lid)=>{const r=st.repuestos.find(x=>x.id===rid);return {r:rid,d:r.nombre,cod:r.cod,q,pu:precio(r,lid,st),dto:0,iva:21};};
    st.presus=[{id:'pr1',num:1,fecha:H(30),cliente:'c3',items:[L('r2',2,'mec'),L('r10',2,'mec')],obs:'',validez:7,estado:'vigente'},
               {id:'pr2',num:2,fecha:H(24*12),cliente:'c6',items:[L('r14',1,'pub'),L('r16',1,'pub')],obs:'',validez:7,estado:'vigente'}];
    st.seq.pr=2;}
  if(!st.pedidos){st.pedidos=[];st.seq.pd=0;}
  return st;
}
const presuVence=p=>new Date(new Date(p.fecha).getTime()+p.validez*864e5);
function presuEstado(p){if(p.estado==='vendido')return 'Vendido';if(p.estado==='anulado')return 'Anulado';return presuVence(p)<new Date()?'Vencido':'Vigente';}
function presuAsComp(p){const c=C(p.cliente)||S.clientes[0];const k=calcComp(p.items);
  return {tipo:'X',letra:'X',titulo:'Presupuesto',presu:true,pv:S.fiscal.pv,nro:p.num,fecha:p.fecha,rec:recDe(c),lines:k.lines,n21:0,i21:0,n105:0,i105:0,total:k.total,pagos:[],condVenta:'contado',obs:`Válido hasta el ${fdFull(presuVence(p).toISOString())}. No descuenta stock.${p.obs?' '+p.obs:''}`,cae:'',asoc:null};}
function presuTxt(p){const c=C(p.cliente);const k=calcComp(p.items);

function cobrarDraft(print){
  const d=ui.draft;
  if(d.envio&&!d.origen&&!String(d.envDest||'').trim()){const f=document.getElementById('fenvd');f&&f.focus();fail('Completá la dirección del envío.');}
  const snap=JSON.parse(JSON.stringify(d));
  const c=emitirDraft();
  if(!snap.origen){
    const v=S.ventas.find(x=>x.factId===c.id);
    if(snap.envio){const cost=snap.items.filter(i=>!i.r&&norm(i.d).indexOf('envio')===0).reduce((a,i)=>a+round2(num(i.q)*num(i.pu)*(1-num(i.dto)/100)),0);
      S.seq.en=(S.seq.en||0)+1;const eid=nid('e');S.envios.push({id:eid,num:S.seq.en,fecha:c.fecha,venta:v?v.id:null,cliente:snap.cliente,destino:snap.envDest.trim(),mod:snap.envMod||'moto',tracking:'',cobrado:cost,real:'',estado:'Preparando',hist:[{e:'Preparando',f:c.fecha}]});if(v)v.envioId=eid;
      setTimeout(()=>toast('El envío quedó en "Envíos" para despachar.'),200);}
    if(snap.presuId){const p=S.presus.find(x=>x.id===snap.presuId);if(p){p.estado='vendido';p.compId=c.id;}}
    save();render();
  }
  if(print)printComp(c);
  return c;
}

const IMP_FIELDS=[['cod','Código',['codigo','cod','sku','articulo','codigo interno','cod interno']],['nombre','Nombre o descripción',['nombre','descripcion','producto','detalle','repuesto','articulo descripcion']],['barras','Código de barras',['barras','ean','codigo de barras','cod barras','cod. barras']],['oem','Código de fábrica',['oem','fabrica','original','nro parte','numero de parte']],['cat','Categoría',['categoria','rubro','familia','tipo']],['marca','Marca',['marca']],['prov','Proveedor',['proveedor','prov']],['stock','Cantidad en stock',['stock','cantidad','existencia','cant','unidades']],['min','Stock mínimo',['minimo','stock minimo','min','reponer']],['costo','Costo',['costo','precio costo','precio de costo','compra','precio compra']],['precio','Precio de venta',['precio','precio venta','precio de venta','venta','pvp','publico','precio publico','lista']],['ubic','Ubicación',['ubicacion','lugar','estante','deposito']],['motos','Sirve para (motos)',['moto','motos','modelo','modelos','compatible','compatibilidad','aplicacion']]];
let XLSX_P=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);if(XLSX_P)return XLSX_P;XLSX_P=new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>window.XLSX?ok(window.XLSX):ko(new Error('x'));sc.onerror=()=>{XLSX_P=null;ko(new Error('No se pudo cargar el lector de Excel. Revisá la conexión a internet o guardá la planilla como CSV.'));};document.head.appendChild(sc);});return XLSX_P;}
function parseCSV(t){const first=t.split(/\r?\n/)[0]||'';const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}else if(ch==='"')q=true;else if(ch===sep){row.push(cell);cell='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=ch;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}return rows;}
function autoMap(headers){const H=headers.map(h=>norm(h).replace(/[._]/g,' ').replace(/\s+/g,' ').trim());const map={};const used=new Set();
  IMP_FIELDS.forEach(([k,,syn])=>{let ix=H.findIndex((h,i)=>!used.has(i)&&syn.includes(h));if(ix<0)ix=H.findIndex((h,i)=>!used.has(i)&&h&&syn.some(sy=>h.indexOf(sy)===0));if(ix>=0){map[k]=String(ix);used.add(ix);}else map[k]='';});return map;}
function impRows(st){const rows=st.rows.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));const g=(r,k)=>st.map[k]===''?'':String(r[Number(st.map[k])]??'').trim();
  return rows.map((r,i)=>{const o={};IMP_FIELDS.forEach(([k])=>o[k]=g(r,k));o._i=i;return o;});}
function impMatch(o){const c=o.cod&&norm(o.cod);return S.repuestos.find(r=>(c&&norm(r.cod)===c)||(o.barras&&r.barras===o.barras));}
function impModal(){
  openModal({title:'Importar stock desde Excel',wide:true,st:{rows:null,file:'',map:{},modo:'reemplazar',err:''},
    body:s=>{if(!s.rows)return `<p>Subí la planilla que usás hoy (Excel o CSV). El sistema reconoce solo las columnas y te deja revisar antes de cargar.</p>
      <label class="drop"><input id="imp-file" type="file" accept=".xlsx,.xls,.csv,.ods"><b>Elegir archivo</b><span class="small muted">o arrastralo acá · .xlsx, .xls o .csv</span></label>
      ${s.err?`<div class="note bad">${esc(s.err)}</div>`:''}
      <div class="box"><h4>¿Qué columnas tiene que tener?</h4><p class="small muted">Como mínimo, el <b>nombre</b> del repuesto. Lo ideal: código, nombre, categoría, proveedor, cantidad, stock mínimo, costo o precio de venta, ubicación y para qué motos sirve. Los títulos pueden estar escritos como quieras: "Descripción", "Cant.", "Rubro"…</p>${CAN_PRINT?'<button class="btn sm" data-act="impModelo">Descargar planilla modelo</button>':''}</div>`;
      const H=s.rows[0].map((h,i)=>String(h||`Columna ${i+1}`));const data=impRows(s);const nuevos=data.filter(o=>o.nombre&&!impMatch(o)).length;const exist=data.filter(o=>impMatch(o)).length;const sinNom=data.filter(o=>!o.nombre&&!impMatch(o)).length;
      const prev=data.slice(0,5);const shown=IMP_FIELDS.filter(([k])=>s.map[k]!=='');
      return `<div class="row"><span class="chip acc">${esc(s.file)}</span><span class="small muted">${data.length} filas</span><span class="spacer"></span><button class="btn sm ghost" data-act="impReset">Elegir otro archivo</button></div>
      <div class="kpis">${tile('Repuestos nuevos',nuevos,'se van a crear')}${tile('Ya existen',exist,'mismo código o código de barras')}${sinNom?tile('Sin nombre',sinNom,'se saltean','warn'):''}</div>
      <div class="box"><h4>Columnas reconocidas</h4><p class="small muted">Revisá que cada dato apunte a la columna correcta de tu planilla.</p><div class="mapg">${IMP_FIELDS.map(([k,l])=>`<label class="field"><span>${l}</span><select id="map-${k}" class="in" data-m="map:${k}"><option value="">— No está —</option>${H.map((h,i)=>`<option value="${i}" ${s.map[k]===String(i)?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div></div>
      ${exist?`<div class="box"><h4>Si el repuesto ya existe</h4><div class="pills" role="group" aria-label="Qué hacer con los existentes"><button data-act="mset" data-k="modo" data-v="reemplazar" aria-pressed="${s.modo==='reemplazar'}">Reemplazar cantidad y datos</button><button data-act="mset" data-k="modo" data-v="sumar" aria-pressed="${s.modo==='sumar'}">Sumar la cantidad</button><button data-act="mset" data-k="modo" data-v="saltear" aria-pressed="${s.modo==='saltear'}">No tocarlos</button></div></div>`:''}
      <div class="box"><h4>Así se van a cargar (primeras ${prev.length} filas)</h4><div class="tw"><table><thead><tr><th></th>${shown.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${prev.map(o=>`<tr><td>${impMatch(o)?'<span class="chip info">existe</span>':o.nombre?'<span class="chip good">nuevo</span>':'<span class="chip warn">sin nombre</span>'}</td>${shown.map(([k])=>`<td class="small">${esc(o[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${s.map.costo===''&&s.map.precio!==''?`<p class="small muted">La planilla trae precio de venta pero no costo: el costo se calcula con el margen de la lista Público (${Math.round(S.listas[0].margen*100)}%).</p>`:''}</div>`;},
    foot:s=>s.rows?`<button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn primary" data-act="impGo">Cargar al stock</button>`:'<button class="btn ghost" data-act="mclose">Cancelar</button>'});
}
function impFile(file){if(!file||!Mo)return;const st=Mo.st;st.err='';const name=file.name;const isCSV=/\.csv$/i.test(name);
  const done=rows=>{if(!rows||rows.length<2){st.err='La planilla está vacía o tiene solo los títulos.';renderModal();return;}st.rows=rows.map(r=>r.map(c=>c==null?'':String(c)));st.file=name;st.map=autoMap(st.rows[0]);if(st.map.nombre===''){st.err='';}renderModal();};
  const rd=new FileReader();
  if(isCSV){rd.onload=()=>done(parseCSV(String(rd.result)));rd.readAsText(file,'utf-8');return;}
  loadXLSX().then(X=>{rd.onload=()=>{try{const wb=X.read(new Uint8Array(rd.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];done(X.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}));}catch(e){st.err='No pudimos leer el archivo. Probá guardarlo como .xlsx o .csv.';renderModal();}};rd.readAsArrayBuffer(file);}).catch(e=>{st.err=e.message;renderModal();});}
function motosDe(txt){const t=norm(txt);if(!t)return [];return S.modelos.filter(m=>{const w=norm(m.modelo).split(' ');return t.includes(norm(m.modelo))||t.includes(w.slice(0,2).join(' '))||(w[0].length>3&&t.includes(w[0]));}).map(m=>({m:m.id,d:m.d,h:m.h}));}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='imp-file')impFile(e.target.files[0]);});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.drop'))e.preventDefault();});
document.addEventListener('drop',e=>{const dz=e.target.closest&&e.target.closest('.drop');if(dz){e.preventDefault();impFile(e.dataTransfer.files[0]);}});

function pedidoModal(){const sg=sugeridos();const sel={};sg.forEach(r=>sel[r.id]={on:true,q:String(sugQ(r))});
  openModal({title:'Pedido a proveedores',wide:true,st:{sel},
    body:s=>{if(!sg.length)return '<div class="empty"><strong>No hay nada para pedir.</strong>Todos los repuestos están por encima del stock mínimo, o ya están pedidos.</div>';

var SYNC={on:false,v:0,base:null,pin:'',state:'local',pending:false,busy:false,timer:null,polling:false};
function localSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

function pinGet(){try{return localStorage.getItem('rcos-pin')||''}catch(e){return ''}}
function pinSet(v){try{v?localStorage.setItem('rcos-pin',v):localStorage.removeItem('rcos-pin')}catch(e){}}
function api(method,url,body){return fetch(url,{method,headers:{'Content-Type':'application/json','x-app-pin':SYNC.pin},body:body?JSON.stringify(body):undefined,cache:'no-store'});}
function renderSync(st){if(st)SYNC.state=st;const m={ok:['good','Sincronizado'],saving:['','Guardando…'],offline:['warn','Sin conexión · se guarda al volver'],error:['bad','No se pudo guardar · reintentando']};const x=SYNC.on?m[SYNC.state]:null;
  document.querySelectorAll('.syncpill').forEach(e=>{e.innerHTML=x?`<span class="chip ${x[0]}" title="Los cambios se ven en todos los dispositivos"><span class="dot"></span>${x[1]}</span>`:'';});}
function emptyData(){const s=migrate(seed());['repuestos','ventas','comps','ots','envios','compras','movs','cierres','presus','pedidos','log'].forEach(k=>s[k]=[]);s.clientes=s.clientes.filter(c=>c.id==='c1');
  s.caja={abierta:false,sid:'s0',desde:now(),apertura:0,usuario:''};Object.keys(s.num).forEach(k=>s.num[k]=0);Object.keys(s.seq).forEach(k=>s.seq[k]=0);s.seq.c=1;return s;}
const COLS=['repuestos','clientes','ventas','comps','ots','envios','compras','movs','cierres','presus','pedidos','log','modelos','listas'];
const rkey=x=>x&&(x.id||x.sid||(x.fecha+'|'+(x.filtro||x.concepto||'')));
function mergeRec(b,l,r,k){if(!b||!r)return l;const m=Object.assign({},r);
  Object.keys(l).forEach(f=>{if(JSON.stringify(l[f])!==JSON.stringify(b[f])){if((k==='repuestos'&&f==='stock')||(k==='clientes'&&f==='deuda'))m[f]=round2((num(r[f]))+(num(l[f])-num(b[f])));else m[f]=l[f];}});return m;}
function mergeState(base,local,remote){
  const out=JSON.parse(JSON.stringify(remote));
  COLS.forEach(k=>{const B=new Map((base[k]||[]).map(x=>[rkey(x),x]));out[k]=out[k]||[];
    (local[k]||[]).forEach(x=>{const id=rkey(x);const b=B.get(id);if(b&&JSON.stringify(b)===JSON.stringify(x))return;
      const ix=out[k].findIndex(y=>rkey(y)===id);if(ix<0){out[k].push(x);return;}out[k][ix]=mergeRec(b,x,out[k][ix],k);});});
  ['seq','num'].forEach(o=>{out[o]=Object.assign({},remote[o]||{});Object.keys(local[o]||{}).forEach(f=>{out[o][f]=Math.max(num(out[o][f]),num(local[o][f]));});});
  ['caja','fiscal'].forEach(o=>{if(JSON.stringify(local[o])!==JSON.stringify(base[o]))out[o]=local[o];});
  const rIds=k=>new Set((remote[k]||[]).map(rkey));
  const rc=rIds('comps');(out.comps||[]).forEach(c=>{if(rc.has(rkey(c)))return;if(out.comps.some(o=>o!==c&&o.tipo===c.tipo&&o.nro===c.nro)){const mx=Math.max(num(out.num[c.tipo]),...out.comps.filter(o=>o.tipo===c.tipo).map(o=>o.nro));c.nro=mx+1;out.num[c.tipo]=c.nro;}});
  ['ots','presus','pedidos','envios'].forEach(k=>{const ri=rIds(k);(out[k]||[]).forEach(x=>{if(ri.has(rkey(x)))return;if(out[k].some(o=>o!==x&&o.num===x.num)){x.num=Math.max(...out[k].map(o=>num(o.num)))+1;}});});
  return out;
}
function softRender(){const a=document.activeElement;const inModal=a&&$('#modal').contains(a);render();if(Mo&&!inModal)renderModal();}
function applyRemote(j){S=migrate(j.data);SYNC.v=j.version;SYNC.base=JSON.stringify(j.data);localSave();softRender();renderSync('ok');}
async function push(){
  if(!SYNC.on||SYNC.busy)return;SYNC.busy=true;SYNC.pending=false;renderSync('saving');
  const snap=JSON.stringify(S);
  try{const r=await api('PUT','/api/state',{base:SYNC.v,data:JSON.parse(snap)});
    if(r.status===200){const j=await r.json();SYNC.v=j.version;SYNC.base=snap;renderSync(SYNC.pending?'saving':'ok');}
    else if(r.status===409){const j=await r.json();const cur=JSON.parse(JSON.stringify(S));S=migrate(mergeState(JSON.parse(SYNC.base),cur,j.data));SYNC.v=j.version;SYNC.base=JSON.stringify(j.data);localSave();softRender();SYNC.pending=true;}
    else if(r.status===401){SYNC.busy=false;pinModal('Tu clave ya no es válida. Ingresala de nuevo.');return;}
    else{SYNC.pending=true;renderSync('error');}
  }catch(e){SYNC.pending=true;renderSync('offline');}
  SYNC.busy=false;
  if(SYNC.pending){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,SYNC.state==='offline'||SYNC.state==='error'?5000:300);}
}
async function poll(){
  if(!SYNC.on||SYNC.busy||SYNC.pending||document.visibilityState!=='visible')return;
  try{const r=await api('GET','/api/state?since='+SYNC.v);
    if(r.status===204){if(SYNC.state!=='ok')renderSync('ok');return;}
    if(r.status===401){pinModal('Tu clave ya no es válida. Ingresala de nuevo.');return;}
    if(!r.ok)return;const j=await r.json();if(SYNC.pending||SYNC.busy)return;
    if(j.data&&j.version!==SYNC.v)applyRemote(j);
  }catch(e){renderSync('offline');}
}
async function syncStart(){
  if(!/^https?:$/.test(location.protocol))return;
  SYNC.pin=pinGet();let r;
  try{r=await api('GET','/api/state');}catch(e){return;}
  if(!(r.headers.get('content-type')||'').includes('application/json'))return;
  if(r.status===401){pinModal(SYNC.pin?'La clave guardada no es correcta.':'');return;}
  if(r.status===429){pinModal('Demasiados intentos. Esperá 15 minutos.');return;}
  let j={};try{j=await r.json();}catch(e){return;}
  if(!r.ok){toast(j.error||'El servidor no respondió bien.','bad');return;}
  SYNC.on=true;SYNC.v=j.version||0;
  if(!SYNC.polling){SYNC.polling=true;setInterval(poll,8000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll();});window.addEventListener('online',()=>{if(SYNC.pending)push();else poll();});
    window.addEventListener('beforeunload',e=>{if(SYNC.pending||SYNC.busy){e.preventDefault();e.returnValue='';}});}
  if(!j.data){startModal();return;}
  applyRemote(j);
}

/* ================= v5: sincronización por registro (escalable) ================= */
var SYNC={on:false,ver:0,base:{},baseN:{},baseObj:{},pin:'',state:'local',pending:false,busy:false,timer:null,ptimer:null,active:Date.now(),months:[],loaded:[],needFull:false,loops:false};
const SPC=['ventas','comps','movs','compras','envios','cierres','log'],SNC=['repuestos','clientes','ots','presus','pedidos'],SOB=['caja','fiscal','listas','modelos'];
const SNUM={repuestos:'stock',clientes:'deuda'};
const SCLAIM={comps:'nro',ots:'num',presus:'num',pedidos:'num',envios:'num'};
const srid=(c,x)=>c==='cierres'?x.sid:c==='log'?(x.id||(x.fecha+'|'+(x.filtro||''))):x.id;
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(36)+'.'+s.length.toString(36);}
function metaSave(){try{localStorage.setItem('rcos-sync',JSON.stringify({ver:SYNC.ver,base:SYNC.base,baseN:SYNC.baseN,baseObj:SYNC.baseObj,months:SYNC.months,loaded:SYNC.loaded}))}catch(e){}}
function metaLoad(){try{const m=JSON.parse(localStorage.getItem('rcos-sync')||'null');if(m&&m.ver){Object.assign(SYNC,{ver:m.ver,base:m.base||{},baseN:m.baseN||{},baseObj:m.baseObj||{},months:m.months||[],loaded:m.loaded||[]});return true;}}catch(e){}return false;}
function metaClear(){SYNC.ver=0;SYNC.base={};SYNC.baseN={};SYNC.baseObj={};try{localStorage.removeItem('rcos-sync')}catch(e){}}
function setBaseRec(c,x){const id=srid(c,x);(SYNC.base[c]=SYNC.base[c]||{})[id]=fnv(JSON.stringify(x));const f=SNUM[c];if(f)(SYNC.baseN[c]=SYNC.baseN[c]||{})[id]=num(x[f]);}
function rebaseAll(){SYNC.base={};SYNC.baseN={};SYNC.baseObj={};[...SPC,...SNC].forEach(c=>(S[c]||[]).forEach(x=>setBaseRec(c,x)));SOB.forEach(o=>SYNC.baseObj[o]=fnv(JSON.stringify(S[o])));}
function sDiff(){const put=[],inc=[],obj={};
  [...SPC,...SNC].forEach(c=>{const B=SYNC.base[c]||{},BN=SYNC.baseN[c]||{};(S[c]||[]).forEach(x=>{const id=srid(c,x);if(!id)return;const j=JSON.stringify(x);const h=fnv(j);if(B[id]===h)return;
    const d=JSON.parse(j);if(SCLAIM[c]&&B[id]===undefined)d._claim=1;put.push({c,id,d,h});const f=SNUM[c];if(f){const dn=round2(num(x[f])-num(BN[id]));if(dn)inc.push({c,id,f,n:dn,v:num(x[f])});}});});
  SOB.forEach(o=>{if(S[o]===undefined)return;const j=JSON.stringify(S[o]);if(SYNC.baseObj[o]!==fnv(j))obj[o]=JSON.parse(j);});
  return {put,inc,obj};}
function schedulePush(){SYNC.pending=true;renderSync('saving');clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,400);}
function applyNums(n){if(!n)return;Object.keys(S.num).forEach(t=>{if(n[t]!=null)S.num[t]=Math.max(num(S.num[t]),num(n[t]));});
  [['otn','OT'],['pr','PR'],['pd','PD'],['en','EN']].forEach(([k,t])=>{if(n[t]!=null)S.seq[k]=Math.max(num(S.seq[k]),num(n[t]));});}
function buildFromFull(j){const keep=S&&S.seq?Object.assign({},S.seq):{};const s=migrate(seed());
  [...SPC,...SNC].forEach(c=>s[c]=(j.cols&&j.cols[c])||[]);SOB.forEach(o=>{if(j.objs&&j.objs[o]!=null)s[o]=j.objs[o];});
  s.seq=Object.assign(s.seq,keep);Object.keys(s.num).forEach(t=>s.num[t]=0);S=migrate(s);applyNums(j.nums);
  SYNC.ver=j.ver;SYNC.months=j.months||[];SYNC.loaded=j.loaded||[];SYNC.needFull=false;rebaseAll();metaSave();localSave();softRender();}
function applyChanges(j){
  if(j.full){buildFromFull(j);return;}
  let touched=false;
  Object.keys(j.cols||{}).forEach(c=>{if(!S[c])S[c]=[];const B=SYNC.base[c]||{},BN=SYNC.baseN[c]||{};const idx=new Map(S[c].map((x,i)=>[srid(c,x),i]));
    j.cols[c].forEach(srv=>{const id=srid(c,srv);const ix=idx.get(id);touched=true;
      if(ix===undefined){S[c].push(srv);setBaseRec(c,srv);return;}
      const loc=S[c][ix];
      if(B[id]===fnv(JSON.stringify(loc))){S[c][ix]=srv;setBaseRec(c,srv);return;}
      const m=Object.assign({},loc);const f=SNUM[c];if(f)m[f]=round2(num(srv[f])+(num(loc[f])-num(BN[id])));const k=SCLAIM[c];if(k&&B[id]!==undefined)m[k]=srv[k];
      S[c][ix]=m;setBaseRec(c,srv);});});
  Object.keys(j.objs||{}).forEach(o=>{const lj=fnv(JSON.stringify(S[o]));if(SYNC.baseObj[o]===undefined||SYNC.baseObj[o]===lj)S[o]=j.objs[o];SYNC.baseObj[o]=fnv(JSON.stringify(j.objs[o]));touched=true;});
  applyNums(j.nums);
  if(j.ver)SYNC.ver=j.ver;metaSave();
  if(touched){localSave();softRender();}
}
async function push(){
  if(!SYNC.on||SYNC.busy)return;
  const ch=sDiff();
  if(!ch.put.length&&!Object.keys(ch.obj).length){SYNC.pending=false;if(SYNC.needFull)return fullReload();renderSync('ok');return;}
  SYNC.busy=true;SYNC.pending=false;renderSync('saving');
  const batch=ch.put.slice(0,400);const ids=new Set(batch.map(p=>p.c+'|'+p.id));const inc=ch.inc.filter(i=>ids.has(i.c+'|'+i.id));
  if(ch.put.length>batch.length)SYNC.pending=true;
  try{const r=await api('POST','/api/sync?since='+SYNC.ver,{put:batch.map(p=>({c:p.c,id:p.id,d:p.d})),inc:inc.map(i=>({c:i.c,id:i.id,f:i.f,n:i.n})),obj:ch.obj});
    if(r.ok){const j=await r.json();
      batch.forEach(p=>{(SYNC.base[p.c]=SYNC.base[p.c]||{})[p.id]=p.h;const f=SNUM[p.c];if(f)(SYNC.baseN[p.c]=SYNC.baseN[p.c]||{})[p.id]=num(p.d[f]);});
      Object.keys(ch.obj).forEach(o=>SYNC.baseObj[o]=fnv(JSON.stringify(ch.obj[o])));
      (j.renum||[]).forEach(x=>{const rec=(S[x.c]||[]).find(y=>srid(x.c,y)===x.id);if(rec){const k=SCLAIM[x.c];rec[k]=x.n;setBaseRec(x.c,rec);}if(x.c==='comps')toast(`Otro equipo usó el mismo número: el comprobante quedó como ${pad8(x.n)}.`,'warn');});
      if(j.stale){SYNC.needFull=true;metaSave();}else applyChanges(j);
      renderSync(SYNC.pending?'saving':'ok');}
    else if(r.status===401||r.status===429){SYNC.busy=false;const j=await r.json().catch(()=>({}));pinModal(j.error||'Tu clave ya no es válida. Ingresala de nuevo.');return;}
    else{SYNC.pending=true;renderSync('error');}
  }catch(e){SYNC.pending=true;renderSync('offline');}
  SYNC.busy=false;
  if(SYNC.pending){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,SYNC.state==='offline'||SYNC.state==='error'?5000:200);}
  else if(SYNC.needFull)fullReload();
}
async function fullReload(){if(SYNC.busy||SYNC.pending)return;SYNC.busy=true;
  try{const r=await api('GET','/api/sync?since=0');if(r.ok){const j=await r.json();if(!SYNC.pending)buildFromFull(j);renderSync('ok');}}catch(e){renderSync('offline');}SYNC.busy=false;}
async function poll(){
  if(!SYNC.on||SYNC.busy)return;
  if(SYNC.pending||sDiff().put.length){return push();}
  if(SYNC.needFull)return fullReload();
  try{const r=await api('GET','/api/sync?since='+SYNC.ver);
    if(r.status===204){if(SYNC.state!=='ok')renderSync('ok');return;}
    if(r.status===401||r.status===429){const j=await r.json().catch(()=>({}));pinModal(j.error||'Tu clave ya no es válida.');return;}
    if(!r.ok){renderSync('error');return;}
    const j=await r.json();if(SYNC.busy||SYNC.pending)return;
    if(j.full&&j.empty){startModal();return;}
    applyChanges(j);renderSync('ok');
  }catch(e){renderSync('offline');}
}
function pollLoop(){clearTimeout(SYNC.ptimer);const vis=document.visibilityState==='visible';const d=!vis?60000:(Date.now()-SYNC.active<120000?5000:30000);
  SYNC.ptimer=setTimeout(async()=>{try{if(vis)await poll();}finally{pollLoop();}},d);}
function startLoops(){if(SYNC.loops)return;SYNC.loops=true;pollLoop();
  ['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{const idle=Date.now()-SYNC.active>120000;SYNC.active=Date.now();if(idle)pollLoop();},{passive:true}));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){SYNC.active=Date.now();poll();pollLoop();}});
  window.addEventListener('online',()=>poll());
  window.addEventListener('beforeunload',e=>{if(SYNC.pending||SYNC.busy){e.preventDefault();e.returnValue='';}});}
async function syncStart(){
  if(!/^https?:$/.test(location.protocol))return;
  SYNC.pin=pinGet();const had=metaLoad();let r;
  try{r=await api('GET','/api/sync?since='+(had?SYNC.ver:0));}
  catch(e){if(had){SYNC.on=true;startLoops();renderSync('offline');}return;}
  const ct=r.headers.get('content-type')||'';
  if(r.status!==204&&!ct.includes('application/json'))return;
  if(r.status===401||r.status===429){let j={};try{j=await r.json();}catch(e){}pinModal(r.status===429?j.error:(SYNC.pin?'La clave guardada no es correcta.':''));return;}
  SYNC.on=true;startLoops();
  if(r.status===204){renderSync('ok');if(sDiff().put.length)schedulePush();return;}
  let j={};try{j=await r.json();}catch(e){return;}
  if(!r.ok){toast(j.error||'El servidor no respondió bien.','bad');renderSync('error');return;}
  if(j.full&&j.empty){startModal();return;}
  if(j.full&&had&&sDiff().put.length){SYNC.needFull=true;schedulePush();return;}
  applyChanges(j);renderSync('ok');if(sDiff().put.length)schedulePush();
}
async function reserveNum(t){if(!SYNC.on||SYNC.state==='offline')return null;
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),2500);const r=await fetch('/api/sync?op=next&t='+encodeURIComponent(t),{method:'POST',headers:{'Content-Type':'application/json','x-app-pin':SYNC.pin},body:'{}',signal:ctl.signal});clearTimeout(tm);if(!r.ok)return null;return await r.json();}catch(e){return null;}}
function olderMonth(){const have=new Set(SYNC.loaded||[]);return (SYNC.months||[]).filter(m=>m!=='0000-00'&&!have.has(m)).sort().reverse()[0]||null;}
const mesTxt=m=>{const [y,mm]=m.split('-');const t=new Date(Number(y),Number(mm)-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1);};
function olderBtn(){const m=SYNC.on&&olderMonth();return m?`<button class="btn sm ghost" data-act="loadOlder" data-v="${m}">Traer ${mesTxt(m)}</button>`:'';}

Object.assign(ACT,{

      Object.keys(j.cols||{}).forEach(c=>{if(!S[c])S[c]=[];const have=new Set(S[c].map(x=>srid(c,x)));j.cols[c].forEach(x=>{if(!have.has(srid(c,x))){S[c].push(x);setBaseRec(c,x);}});});
      SYNC.loaded=(SYNC.loaded||[]).concat([d.v]);metaSave();localSave();render();toast(`Listo: ${mesTxt(d.v)} cargado.`);}catch(e){toast(e.message||'Sin conexión.','bad');}},
  startWith:d=>{S=d.v==='vacio'?emptyData():d.v==='demo'?migrate(seed()):S;ui.draft=newDraft();ui.cart=[];closeModal();metaClear();localSave();render();SYNC.on=true;SYNC.needFull=true;schedulePush();toast('Subiendo los datos a la base del taller…');},
  resetOk:async()=>{const modo=Mo&&Mo.st.modo;
    if(SYNC.on){try{const r=await api('POST','/api/sync?op=reset',{confirm:'BORRAR'});if(!r.ok)fail('No se pudo borrar. Probá de nuevo.');}catch(e){toast(e.message||'Sin conexión.','bad');return;}metaClear();}
    S=modo==='vacio'?emptyData():migrate(seed());ui.cart=[];ui.draft=newDraft();ui.clienteId='c1';ui.pagaCon='';closeModal();localSave();render();
    if(SYNC.on){SYNC.needFull=true;schedulePush();}toast('Listo, se empezó de nuevo.');},
  syncOut:()=>{pinSet('');metaClear();location.reload();}
});
let emitiendo=false;
async function emitirConNumero(print){
  if(emitiendo)return;emitiendo=true;
  try{const t=tipoDraft();let res=null;
    if(SYNC.on&&!ui.draft.origen&&ui.draft.items.length){res=await reserveNum(t);if(res)S.num[t]=res.n-1;}
